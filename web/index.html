<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>합경 — 세션 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15130E;
    --panel: #1F1B14;
    --panel2: #29231A;
    --rust: #8B2E6B;
    --amber: #E8A33D;
    --olive: #3E6B8B;
    --paper: #E3D8BE;
    --paper-dim: #A69D86;
    --danger: #B0453F;
    --border: #3E3624;
    --good: #3E6B8B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--paper);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(193,85,45,0.07), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(124,139,90,0.06), transparent 45%);
  }
  h1, h2, h3, .disp { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button {
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    background: var(--panel2); color: var(--paper); border: 1px solid var(--border);
    border-radius: 3px; padding: 9px 16px; font-size: 14px; font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--amber); background: #332C1F; }
  button.primary { background: var(--rust); border-color: var(--rust); color: #1a0e08; font-weight: 700; }
  button.primary:hover { background: #D6663D; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  input, textarea, select {
    font-family: 'Noto Sans KR', sans-serif; background: #100E0A; color: var(--paper);
    border: 1px solid var(--border); border-radius: 3px; padding: 9px 11px; font-size: 14px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--amber); }
  ::placeholder { color: var(--paper-dim); }

  .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.09) 0px, rgba(0,0,0,0.09) 1px, transparent 1px, transparent 3px);
    opacity: .35; }

  #join { max-width: 480px; margin: 0 auto; padding: 60px 20px; position: relative; z-index: 1; }
  .join-title { font-size: 42px; color: var(--rust); text-align: center; margin: 0 0 4px; }
  .join-sub { text-align: center; color: var(--paper-dim); font-size: 13px; margin: 0 0 36px; letter-spacing: 0.08em; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--olive); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;}
  .code-row { display: flex; gap: 8px; }
  .code-row input { text-transform: uppercase; letter-spacing: 0.15em; font-family: 'JetBrains Mono', monospace; font-size: 18px; text-align: center;}
  .join-note { font-size: 12px; color: var(--paper-dim); margin-top: 30px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 16px; }

  #app { display: none; position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 4px; border-bottom: 2px solid var(--rust); margin-bottom: 18px; flex-wrap: wrap; gap: 10px;}
  .topbar .logo { font-size: 22px; color: var(--rust); margin: 0; }
  .topbar .meta { font-size: 12px; color: var(--paper-dim); }
  .topbar .meta b { color: var(--amber); }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn { flex: 1; min-width: 130px; text-align: center; }
  .tab-btn.active { background: var(--rust); border-color: var(--rust); color: #1a0e08; font-weight: 700; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 18px; margin-bottom: 16px; }
  .panel h3 { color: var(--amber); font-size: 16px; margin: 0 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;}

  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; margin-bottom: 18px;}
  .char-card { border: 1px solid var(--border); border-radius: 4px; padding: 12px; background: var(--panel2); cursor: pointer; position: relative; }
  .char-card:hover { border-color: var(--amber); }
  .char-card.mine { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); }
  .char-card.taken { opacity: .55; }
  .char-card .cname { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .char-card .ctitle { font-size: 11px; color: var(--paper-dim); margin-bottom: 6px; }
  .char-card .claim { font-size: 11px; color: var(--olive); margin-top: 6px; }

  .sheet { border-top: 3px solid; padding-top: 14px; }
  .sheet .name { font-size: 26px; font-family: 'Oswald'; margin: 0; }
  .sheet .title { color: var(--paper-dim); font-size: 13px; margin: 0 0 10px; }
  .bg-text { font-style: italic; color: var(--paper-dim); font-size: 13px; margin-bottom: 14px; }
  .stat-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 16px; }
  .stat-box { text-align: center; background: #100E0A; border: 1px solid var(--border); border-radius: 3px; padding: 8px 2px; }
  .stat-box .k { font-size: 10px; color: var(--paper-dim); letter-spacing: .1em; }
  .stat-box .v { font-family: 'JetBrains Mono'; font-size: 20px; font-weight: 700; color: var(--amber); }
  .track-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .track { background: #100E0A; border: 1px solid var(--border); border-radius: 3px; padding: 10px; }
  .track label { font-size: 11px; color: var(--olive); text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 700;}
  .track .row2 { display: flex; align-items: center; gap: 6px; }
  .track input[type=number] { width: 100%; font-family: 'JetBrains Mono'; text-align: center; }
  .bar { height: 6px; border-radius: 3px; background: #3A3324; margin-top: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--olive); }
  .bar-fill.rad { background: var(--rust); }
  .kv { font-size: 13px; margin-bottom: 8px; line-height: 1.6; }
  .kv b { color: var(--amber); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px;}
  .trait-box { border: 1px solid var(--olive); background: rgba(124,139,90,0.08); border-radius: 3px; padding: 10px 12px; font-size: 13px; margin-top: 8px;}
  select.status { width: auto; }

  .dice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px,1fr)); gap: 8px; margin-bottom: 14px;}
  .roll-result { text-align: center; padding: 22px 10px; background: #100E0A; border-radius: 4px; border: 1px solid var(--border); margin-bottom: 14px; }
  .roll-result .big { font-family: 'JetBrains Mono'; font-size: 46px; font-weight: 700; color: var(--amber); }
  .roll-result .expr { font-size: 13px; color: var(--paper-dim); margin-top: 4px; }
  .modrow { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
  .modrow .field { margin: 0; flex: 1; min-width: 120px; }

  .log-list { max-height: 480px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 6px; }
  .log-item { font-size: 13px; border-left: 3px solid var(--border); padding: 6px 10px; background: var(--panel2); border-radius: 0 3px 3px 0; }
  .log-item .t { color: var(--paper-dim); font-size: 11px; font-family: 'JetBrains Mono'; margin-right: 8px;}
  .log-item.roll { border-left-color: var(--amber); }
  .log-item.gm { border-left-color: var(--rust); }
  .log-item.sys { border-left-color: var(--olive); }

  .init-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;}
  .init-item { display: grid; grid-template-columns: 40px 1fr 60px 80px 30px; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel2); border-radius: 3px; border: 1px solid var(--border); }
  .init-item.current { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .init-item input { padding: 5px 6px; font-size: 13px; }
  .init-item .rm { color: var(--danger); cursor: pointer; text-align:center; font-weight:700; }
  .addrow { display: flex; gap: 6px; }
  .addrow input { flex: 1; }
  .mon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 10px; }
  .mon-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-size: 13px; }
  .mon-card .mname { font-family: 'Oswald'; font-size: 15px; color: var(--rust); margin-bottom: 4px; }
  .mon-card .mstat { color: var(--paper-dim); font-family: 'JetBrains Mono'; font-size: 12px; margin-bottom: 4px;}

  .timer-box { display: flex; align-items: center; gap: 12px; }
  .timer-display { font-family: 'JetBrains Mono'; font-size: 32px; color: var(--amber); min-width: 110px; }
  .small-note { font-size: 12px; color: var(--paper-dim); margin-top: 10px; line-height: 1.6; }
  .gm-flag { display: inline-block; background: var(--rust); color: #1a0e08; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 8px;}
  .empty { color: var(--paper-dim); font-size: 13px; text-align: center; padding: 20px; }
  @media (max-width: 640px) {
    .stat-row { grid-template-columns: repeat(3,1fr); }
    .track-row { grid-template-columns: 1fr; }
    .init-item { grid-template-columns: 32px 1fr 50px 60px 24px; }
  }
</style>
</head>
<body>
<div class="scanlines"></div>

<div id="join">
  <h1 class="join-title">합경</h1>
  <p class="join-sub">CONFLUENCE — SESSION TERMINAL</p>
  <div class="field">
    <label>당신의 이름</label>
    <input id="in-name" placeholder="예: 지운" maxlength="20">
  </div>
  <div class="field">
    <label>방 코드 (진행자가 만든 코드를 입력, 또는 새로 생성)</label>
    <div class="code-row">
      <input id="in-code" placeholder="ABCD" maxlength="6">
      <button id="btn-gen" type="button">생성</button>
    </div>
  </div>
  <button class="primary" id="btn-join" style="width:100%; padding:12px; font-size:15px;">세션 입장</button>
  <p class="join-note">같은 방 코드를 입력한 사람들끼리 캐릭터시트·주사위 기록·세션 로그가 실시간으로 공유됩니다.<br><br>
  ⚠ 이 페이지가 Claude 아티팩트로 살아있는 상태(claude.ai 링크)일 때만 동기화가 작동합니다. 다운로드한 파일을 그냥 열면 나 혼자 보는 로컬 모드로만 동작해요.</p>
</div>

<div id="app">
  <div class="topbar">
    <h1 class="logo">합경</h1>
    <div class="meta">방 코드 <b id="meta-code" class="mono"></b> · 접속자 <b id="meta-name"></b><span id="gm-flag-holder"></span></div>
  </div>
  <div class="tabs">
    <button class="tab-btn" data-tab="char">캐릭터시트</button>
    <button class="tab-btn" data-tab="dice">주사위</button>
    <button class="tab-btn" data-tab="gm">GM 대시보드</button>
    <button class="tab-btn" data-tab="log">세션 로그</button>
  </div>
  <div id="tab-content"></div>
</div>

        const x1=50+r1*Math.cos(rad), y1=50+r1*Math.sin(rad);
        const x2=50+r2*Math.cos(rad), y2=50+r2*Math.sin(rad);
        teeth += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#fff" stroke-width="6"/>`;
      });
      return `<circle cx="50" cy="50" r="16" fill="none" stroke="#fff" stroke-width="4"/><circle cx="50" cy="50" r="5" fill="#fff"/>${teeth}`;
    }
    case "coin": return `<circle cx="50" cy="50" r="28" fill="none" stroke="#fff" stroke-width="4"/><circle cx="50" cy="50" r="18" fill="none" stroke="#fff" stroke-width="2"/><line x1="50" y1="32" x2="50" y2="68" stroke="#fff" stroke-width="3"/>`;
    case "scope": return `<circle cx="50" cy="50" r="24" fill="none" stroke="#fff" stroke-width="4"/><line x1="50" y1="14" x2="50" y2="30" stroke="#fff" stroke-width="4"/><line x1="50" y1="70" x2="50" y2="86" stroke="#fff" stroke-width="4"/><line x1="14" y1="50" x2="30" y2="50" stroke="#fff" stroke-width="4"/><line x1="70" y1="50" x2="86" y2="50" stroke="#fff" stroke-width="4"/>`;
    case "fist": return `<rect x="32" y="40" width="36" height="30" rx="8" fill="none" stroke="#fff" stroke-width="4"/><line x1="42" y1="40" x2="42" y2="24" stroke="#fff" stroke-width="4"/><line x1="50" y1="40" x2="50" y2="20" stroke="#fff" stroke-width="4"/><line x1="58" y1="40" x2="58" y2="24" stroke="#fff" stroke-width="4"/><rect x="24" y="48" width="12" height="16" rx="4" fill="none" stroke="#fff" stroke-width="4"/>`;
    case "leaf": return `<path d="M50 18 C72 28 76 56 50 84 C24 56 28 28 50 18 Z" fill="none" stroke="#fff" stroke-width="4"/><line x1="50" y1="30" x2="50" y2="76" stroke="#fff" stroke-width="3"/>`;
    case "bat": return `<path d="M50 42 C42 24 20 26 14 40 C24 40 32 44 38 52 C30 52 20 56 16 64 C28 62 38 58 46 50 L50 58 L54 50 C62 58 72 62 84 64 C80 56 70 52 62 52 C68 44 76 40 86 40 C80 26 58 24 50 42 Z" fill="none" stroke="#fff" stroke-width="3.5"/>`;
    case "flame": return `<path d="M50 18 C58 34 70 40 66 56 C64 66 56 72 50 72 C44 72 36 66 34 56 C30 40 42 34 50 18 Z" fill="none" stroke="#fff" stroke-width="4"/><path d="M50 40 C54 48 58 52 56 60 C55 65 52 68 50 68" fill="none" stroke="#fff" stroke-width="2.5"/>`;
    default: return `<circle cx="50" cy="50" r="20" fill="none" stroke="#fff" stroke-width="4"/>`;
  }
}
function emblemSVG(color, iconKey, size){
  size = size || 60;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <circle cx="50" cy="50" r="48" fill="${color}"/>
    <circle cx="50" cy="50" r="48" fill="none" stroke="#00000030" stroke-width="1.5"/>
    ${iconPaths(iconKey)}
  </svg>`;
}


let ROOM_CODE = "", PLAYER_NAME = "", IS_GM = false;
let activeTab = "char";
let selectedChar = null;

function genCode(){ const s="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<4;i++) c+=s[Math.floor(Math.random()*s.length)]; return c; }

function defaultRoom(){
  const characters = {};
  PREGENS.forEach(p => { characters[p.name] = { claimedBy:null, hp:p.maxHp, radiation:0, parts:p.startParts, status:"경상", notes:"" }; });
  return { characters, log:[], initiative:[], round:1, turnIndex:0, gm:null, timer:null };
}

async function loadRoom(){
  try {
    const r = await window.storage.get("room_"+ROOM_CODE, true);
    if (r && r.value) return JSON.parse(r.value);
  } catch(e) {}
  return defaultRoom();
}
async function saveRoom(state){
  try { await window.storage.set("room_"+ROOM_CODE, JSON.stringify(state), true); } catch(e) { console.error("storage save failed", e); }
}

let ROOM = defaultRoom();
let saveTimer = null;
async function withRoom(mutator){
  ROOM = await loadRoom();
  mutator(ROOM);
  await saveRoom(ROOM);
  render();
}
function addLog(state, text, type){
  state.log = state.log || [];
  state.log.push({ id: Date.now()+Math.random().toString(16).slice(2), time: new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}), text, type: type||"sys" });
  if (state.log.length > 300) state.log = state.log.slice(-300);
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

// ---------- JOIN ----------
document.getElementById('btn-gen').onclick = () => { document.getElementById('in-code').value = genCode(); };
document.getElementById('btn-join').onclick = async () => {
  const name = document.getElementById('in-name').value.trim();
  let code = document.getElementById('in-code').value.trim().toUpperCase();
  if (!name) { alert("이름을 입력해 주세요."); return; }
  if (!code) { code = genCode(); }
  PLAYER_NAME = name; ROOM_CODE = code;
  document.getElementById('join').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('meta-code').textContent = ROOM_CODE;
  document.getElementById('meta-name').textContent = PLAYER_NAME;
  ROOM = await loadRoom();
  if (!ROOM.characters) ROOM = defaultRoom();
  addLog(ROOM, `${PLAYER_NAME}님이 접속했습니다.`, "sys");
  await saveRoom(ROOM);
  switchTab('char');
  startPolling();
};

// ---------- TABS ----------
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
function switchTab(t){
  activeTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
  render();
}

function startPolling(){
  setInterval(async () => {
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
    if (typing) return;
    ROOM = await loadRoom();
    render();
  }, 4000);
}

// ---------- RENDER ----------
function render(){
  const gmHolder = document.getElementById('gm-flag-holder');
  gmHolder.innerHTML = ROOM.gm ? `<span class="gm-flag">GM: ${ROOM.gm}</span>` : '';
  const c = document.getElementById('tab-content');
  c.innerHTML = '';
  if (activeTab === 'char') renderChar(c);
  else if (activeTab === 'dice') renderDice(c);
  else if (activeTab === 'gm') renderGM(c);
  else if (activeTab === 'log') renderLog(c);
}

        <div style="width:56px;height:56px;flex-shrink:0">${emblemSVG(p.color,p.icon,56)}</div>

      </div>
      <p class="bg-text">${p.bg}</p>

        ${Object.entries(p.stats).map(([k,v])=>`<div class="stat-box"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}

          <div class="bar"><div class="bar-fill" style="width:${hpPct}%"></div></div>
        </div>
        <div class="track">
          <label>위상잔향</label>

  ['f-hp','f-rad','f-parts'].forEach(id => panel2.querySelector('#'+id).onchange = save);

let lastRoll = null;
function renderDice(c){
  const panel = el(`<div class="panel"><h3>주사위 굴리기</h3></div>`);
  const resultBox = el(`<div class="roll-result"><div class="big">-</div><div class="expr">아래에서 주사위를 선택하세요</div></div>`);
  if (lastRoll) {
    resultBox.querySelector('.big').textContent = lastRoll.total;
    resultBox.querySelector('.expr').textContent = lastRoll.expr;
  }
  panel.appendChild(resultBox);

  const modrow = el(`<div class="modrow">
    <div class="field"><label>수정치 (능력치 보정 + 숙련 등)</label><input type="number" id="mod-input" value="0"></div>
    <div class="field"><label>이 굴림의 이름</label><input type="text" id="mod-label" placeholder="예: 라비의 은신 판정"></div>
  </div>`);
  panel.appendChild(modrow);

  const grid = el(`<div class="dice-grid"></div>`);
  [4,6,8,10,12,20].forEach(sides => {
    const b = el(`<button>d${sides}</button>`);
    b.onclick = () => rollDice(1, sides);
    grid.appendChild(b);
  });
  const b2d6 = el(`<button>2d6</button>`); b2d6.onclick = () => rollDice(2,6); grid.appendChild(b2d6);
  const b2d8 = el(`<button>2d8</button>`); b2d8.onclick = () => rollDice(2,8); grid.appendChild(b2d8);
  panel.appendChild(grid);

  const dcPanel = el(`<div style="font-size:12px;color:var(--paper-dim);margin-top:6px">
    DC 참고: ${DC_TABLE.map(([n,d])=>`${n} ${d}`).join(' · ')}
  </div>`);
  panel.appendChild(dcPanel);
  c.appendChild(panel);

  function rollDice(count, sides){
    let rolls = [];
    for (let i=0;i<count;i++) rolls.push(1+Math.floor(Math.random()*sides));
    const mod = parseInt(document.getElementById('mod-input').value)||0;
    const sum = rolls.reduce((a,b)=>a+b,0);
    const total = sum + mod;
    const label = document.getElementById('mod-label').value.trim();
    const expr = `${count}d${sides} [${rolls.join(', ')}] ${mod>=0?'+':''}${mod} = ${total}`;
    lastRoll = { total, expr };
    render();
    withRoom(state => {
      addLog(state, `${PLAYER_NAME}${label?' — '+label:''}: ${expr}`, "roll");
    });
  }
}

function renderGM(c){
  const claimPanel = el(`<div class="panel"><h3>GM 지정</h3></div>`);
  if (!ROOM.gm) {
    const btn = el(`<button class="primary">내가 이 세션의 GM입니다</button>`);
    btn.onclick = () => withRoom(state => { state.gm = PLAYER_NAME; addLog(state, `${PLAYER_NAME}님이 GM으로 지정되었습니다.`, "gm"); });
    claimPanel.appendChild(btn);
  } else {
    claimPanel.appendChild(el(`<div class="kv">현재 GM: <b style="color:var(--rust)">${ROOM.gm}</b></div>`));
    if (ROOM.gm === PLAYER_NAME) {
      const btn = el(`<button class="ghost">GM 해제</button>`);
      btn.onclick = () => withRoom(state => { state.gm = null; });
      claimPanel.appendChild(btn);
    }
  }
  c.appendChild(claimPanel);

  // Initiative tracker
  const initPanel = el(`<div class="panel"><h3>이니셔티브 트래커 — 라운드 <span class="mono" id="round-num">${ROOM.round||1}</span></h3></div>`);
  const list = el(`<div class="init-list"></div>`);
  const sorted = [...(ROOM.initiative||[])].sort((a,b)=>b.init-a.init);
  sorted.forEach((it, idx) => {
    const isCurrent = idx === (ROOM.turnIndex||0);
    const row = el(`<div class="init-item ${isCurrent?'current':''}">
      <input type="number" class="mono" value="${it.init}" data-id="${it.id}" data-field="init">
      <div style="font-weight:600">${it.name} ${it.isPC?'':'<span style=\"color:var(--danger);font-size:11px\">(적)</span>'}</div>
      <input type="number" class="mono" value="${it.hp}" data-id="${it.id}" data-field="hp">
      <span class="mono" style="color:var(--paper-dim);font-size:12px">/ ${it.maxHp}</span>
      <div class="rm" data-id="${it.id}">✕</div>
    </div>`);
    list.appendChild(row);
  });
  initPanel.appendChild(list);
  const addrow = el(`<div class="addrow">
    <input id="new-combatant" placeholder="이름">
    <input id="new-init" type="number" placeholder="선제권" style="max-width:90px">
    <input id="new-hp" type="number" placeholder="HP" style="max-width:80px">
    <button id="add-combatant">추가</button>
  </div>`);
  initPanel.appendChild(addrow);
  const ctrlrow = el(`<div style="display:flex;gap:8px;margin-top:12px">
    <button id="next-turn" class="primary">다음 턴 ▶</button>
    <button id="reset-init" class="ghost">전투 초기화</button>
  </div>`);
  initPanel.appendChild(ctrlrow);
  c.appendChild(initPanel);

  list.querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const id = inp.dataset.id, field = inp.dataset.field, val = parseInt(inp.value)||0;
    withRoom(state => { const it = state.initiative.find(x=>x.id===id); if(it) it[field]=val; });
  });
  list.querySelectorAll('.rm').forEach(rm => rm.onclick = () => {
    withRoom(state => { state.initiative = state.initiative.filter(x=>x.id!==rm.dataset.id); });
  });
  addrow.querySelector('#add-combatant').onclick = () => {
    const name = document.getElementById('new-combatant').value.trim();
    const init = parseInt(document.getElementById('new-init').value)||0;
    const hp = parseInt(document.getElementById('new-hp').value)||10;
    if (!name) return;
    withRoom(state => {
      state.initiative = state.initiative || [];
      state.initiative.push({ id: Date.now()+Math.random().toString(16).slice(2), name, init, hp, maxHp:hp, isPC:!!PREGENS.find(p=>p.name===name) });
      addLog(state, `전투 참가자 추가: ${name} (선제권 ${init})`, "gm");
    });
  };
  ctrlrow.querySelector('#next-turn').onclick = () => withRoom(state => {
    const n = (state.initiative||[]).length;
    if (!n) return;
    state.turnIndex = ((state.turnIndex||0)+1) % n;
    if (state.turnIndex === 0) state.round = (state.round||1)+1;
  });
  ctrlrow.querySelector('#reset-init').onclick = () => { if(confirm("전투 참가자 전원을 지울까요?")) withRoom(state => { state.initiative = []; state.round = 1; state.turnIndex = 0; }); };

  // Monster reference
  const monPanel = el(`<div class="panel"><h3>몬스터/NPC 참고자료</h3></div>`);
  const mgrid = el(`<div class="mon-grid"></div>`);
  MONSTERS.forEach(m => {
    mgrid.appendChild(el(`<div class="mon-card">
      <div class="mname">${m.name}</div>
      <div class="mstat">HP ${m.hp} · AC ${m.ac}</div>
      <div class="mstat">공격 ${m.atk}</div>
      <div style="color:var(--paper-dim)">${m.note}</div>
    </div>`));
  });
  monPanel.appendChild(mgrid);
  c.appendChild(monPanel);

  // Timer
  const timerPanel = el(`<div class="panel"><h3>세션 타이머</h3></div>`);
  const tbox = el(`<div class="timer-box"></div>`);
  const display = el(`<div class="timer-display mono" id="timer-disp">--:--</div>`);
  tbox.appendChild(display);
  const startBtn = el(`<button id="timer-start">15분 타이머 시작</button>`);
  const clearBtn = el(`<button class="ghost" id="timer-clear">해제</button>`);
  tbox.appendChild(startBtn); tbox.appendChild(clearBtn);
  timerPanel.appendChild(tbox);
  c.appendChild(timerPanel);
  function tick(){
    if (!ROOM.timer) { display.textContent = "--:--"; return; }
    const remain = Math.max(0, Math.floor((ROOM.timer.endsAt - Date.now())/1000));
    const m = String(Math.floor(remain/60)).padStart(2,'0'), s = String(remain%60).padStart(2,'0');
    display.textContent = `${m}:${s}`;
  }
  tick();
  const iv = setInterval(() => { if (document.getElementById('timer-disp')) tick(); else clearInterval(iv); }, 1000);
  startBtn.onclick = () => withRoom(state => { state.timer = { endsAt: Date.now()+15*60*1000 }; addLog(state, "GM이 15분 타이머를 시작했습니다.", "gm"); });
  clearBtn.onclick = () => withRoom(state => { state.timer = null; });
}

function renderLog(c){
  const panel = el(`<div class="panel"><h3>세션 로그</h3></div>`);
  const list = el(`<div class="log-list"></div>`);
  const log = ROOM.log || [];
  if (!log.length) list.appendChild(el(`<div class="empty">아직 기록이 없습니다.</div>`));
  [...log].reverse().forEach(it => {
    list.appendChild(el(`<div class="log-item ${it.type}"><span class="t">${it.time}</span>${it.text}</div>`));
  });
  panel.appendChild(list);
  const addrow = el(`<div class="addrow" style="margin-top:12px">
    <input id="new-log" placeholder="세션 기록 추가 (장면 전환, GM 판정 등)">
    <button id="add-log">기록</button>
  </div>`);
  panel.appendChild(addrow);
  addrow.querySelector('#add-log').onclick = () => {
    const t = document.getElementById('new-log').value.trim();
    if (!t) return;
    withRoom(state => addLog(state, `${PLAYER_NAME}: ${t}`, ROOM.gm===PLAYER_NAME?"gm":"sys"));
    document.getElementById('new-log').value = '';
  };
  c.appendChild(panel);
}
</script>
</body>
</html>
